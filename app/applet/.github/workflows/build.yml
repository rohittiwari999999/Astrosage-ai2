name: Build Android APK and Play Store AAB

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Test APK (Debug)
        run: ./gradlew :app:assembleDebug

      - name: Build Play Store App Bundle (AAB)
        run: ./gradlew :app:bundleDebug

      - name: Upload Test APK
        uses: actions/upload-artifact@v4
        with:
          name: AstroSage-Test-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Play Store AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: AstroSage-PlayStore-AAB
          path: app/build/outputs/bundle/debug/*.aab
          retention-days: 30
